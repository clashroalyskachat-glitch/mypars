<!doctype html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админка — НКСЭ</title>
    <meta name="description" content="Служебная страница: удаление и модерация пожеланий и книг.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#08080a">
    <link rel="icon" href="../library/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="admin.css">

    <script>
        /*
         * Тема общая с меню, библиотекой и доской пожеланий ('nkse-theme'),
         * по умолчанию тёмная. Пишем её сразу, чтобы страница не мигала.
         */
        (function () {
            try {
                var shared = localStorage.getItem('nkse-theme');
                var light = (shared || localStorage.getItem('wishes.theme')) === 'light';

                document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');

                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', light ? '#e9e5dd' : '#08080a');
            } catch (e) { /* приватный режим - тёмная */ }
        })();
    </script>
</head>
<body>

<div class="bg" aria-hidden="true">
    <span class="glow glow-warm"></span>
    <span class="glow glow-cold"></span>
    <span class="shade"></span>
</div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar" id="topbar">
    <div class="wrap topbar-inner">
        <a class="back-btn" href="/" aria-label="Вернуться в меню" title="В меню">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 5l-7 7 7 7"/>
            </svg>
            <span class="back-label">Меню</span>
        </a>

        <a class="brand" href="../" aria-label="Доска пожеланий">
            <span class="brand-text">
                <span class="brand-name">НКСЭ</span>
                <span class="brand-note">админка</span>
            </span>
        </a>

        <button class="btn btn-quiet lock-btn" id="logout" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
                <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>
            </svg>
            <span>Выйти</span>
        </button>
    </div>
</header>

<main>

    <section class="hero wrap">
        <p class="eyebrow"><span class="pulse" aria-hidden="true"></span>Закрытый раздел</p>
        <h1 class="hero-title">Админка</h1>
        <p class="hero-lede">
            Пожелания и книги: удаление и модерация в одном месте.
        </p>
    </section>

    <!-- ------------------------------------------------------------ замок -->

    <section class="wrap gate" id="gate">
        <form class="gate-card" id="gate-form" novalidate>
            <span class="stitch" aria-hidden="true"></span>

            <div class="gate-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
                    <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>
                    <circle cx="12" cy="15.4" r="1.3"/>
                </svg>
            </div>

            <h2>Введите пароль</h2>
            <p class="gate-note">Доступ по паролю.</p>

            <label class="gate-field">
                <span class="sr-only">Пароль</span>
                <input id="key" type="password" placeholder="Пароль" autocomplete="current-password" spellcheck="false" required>
            </label>

            <label class="gate-remember">
                <input id="remember" type="checkbox" checked>
                <span>Запомнить на этом устройстве</span>
            </label>

            <button class="btn btn-solid" id="unlock" type="submit">Войти</button>

            <p class="gate-error" id="gate-error" role="alert" hidden></p>
        </form>
    </section>

    <!-- ------------------------------------------------------- рабочая часть -->

    <section class="wrap panel" id="panel" hidden>
        <div class="tabs" id="tabs" role="group" aria-label="Что правим">
            <button class="tab" type="button" data-target="wishes" aria-pressed="true">
                Пожелания <span class="tab-count" id="count-wishes">—</span>
            </button>
            <button class="tab" type="button" data-target="books" aria-pressed="false">
                Книги <span class="tab-count" id="count-books">—</span>
            </button>
        </div>

        <div class="toolbar">
            <label class="toggle">
                <input id="show-hidden" type="checkbox">
                <span>Только скрытые</span>
            </label>

            <span class="toolbar-note" id="status">Загрузка…</span>

            <button class="btn btn-quiet" id="refresh" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 11a8 8 0 1 0-.7 4.3"/>
                    <path d="M20 4.5V11h-6.4"/>
                </svg>
                <span>Обновить</span>
            </button>
        </div>

        <div class="items" id="items"></div>

        <div class="items-empty" id="items-empty" hidden>
            <p id="items-empty-title">Пусто</p>
        </div>
    </section>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../library/books.js"></script>
<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
