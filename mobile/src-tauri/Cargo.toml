[package]
name = "nkse-mobile"
version = "0.1.0"
description = "NKSE schedule — offline Android app"
authors = ["NKSE"]
edition = "2021"

[lib]
name = "nkse_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
