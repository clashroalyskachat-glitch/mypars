name: Auto-Update Schedule & Deploy

on:
  push:
    # Any push to main goes live. The parser's own schedule.json commit uses
    # "[skip ci]" so it cannot retrigger this workflow - no loop.
    branches:
      - main
  schedule:
    # NB: cron is UTC (GitHub Actions). Moscow = UTC+3.
    # Times avoid the :00 slot on purpose - GitHub delays scheduled runs
    # most heavily on the hour, by 15-60 minutes.
    - cron: '7 23 * * *'    # 02:07 МСК - ночной, ловит правки на следующий день
    - cron: '25 6 * * *'    # 09:25 МСК - за 5 мин до конца 1-й пары (09:30)
    - cron: '55 7 * * *'    # 10:55 МСК - за 5 мин до конца 2-й пары (11:00)
    - cron: '15 9 * * *'    # 12:15 МСК - за 5 мин до конца пары 12:20
    - cron: '35 9 * * *'    # 12:35 МСК - за 5 мин до конца пары 12:40
    - cron: '3 10 * * *'    # 13:03 МСК - доп. прогон после обеда
    - cron: '25 11 * * *'   # 14:25 МСК - за 5 мин до конца 3-й пары (14:30)
    - cron: '5 13 * * *'    # 16:05 МСК - за 5 мин до конца 4-й пары (16:10)
    - cron: '3 14 * * *'    # 17:03 МСК - доп. прогон
    - cron: '35 14 * * *'   # 17:35 МСК - за 5 мин до конца 5-й пары (17:40)
  workflow_dispatch: # Ручной запуск кнопкой в GitHub

# Не запускать новый прогон, пока предыдущий ещё идёт
concurrency:
  group: parse-schedule
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Schedule Parser
        run: python update_all_groups_v3.py

      - name: Commit and push if schedule changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule.json [skip ci]" && git push || echo "Push skipped")

  deploy:
    needs: update-schedule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
