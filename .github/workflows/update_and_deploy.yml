name: Auto-Update Schedule & Deploy

on:
  push:
    # Any push to main goes live. The parser's own schedule.json commit uses
    # "[skip ci]" so it cannot retrigger this workflow - no loop.
    branches:
      - main
  schedule:
    # NB: cron is UTC (GitHub Actions). Moscow = UTC+3.
    # Днём (06:00–22:00 МСК) проверяем каждые 10 минут — это максимум, который
    # GitHub Pages стабильно переваривает (у Pages мягкий лимит 10 деплоев/час).
    # Ночью хватает раза в полчаса.
    - cron: '*/10 3-18 * * *'      # 06:00–21:50 МСК
    - cron: '*/30 19-23,0-2 * * *' # 22:00–05:50 МСК
  workflow_dispatch: # Ручной запуск кнопкой в GitHub

# Не запускать новый прогон, пока предыдущий ещё идёт
concurrency:
  group: parse-schedule
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ETag/Last-Modified кэш страниц колледжа: без него каждый прогон
      # скачивает все 24 страницы заново. С кэшем почти всё отвечает 304.
      - name: Restore parser page cache
        uses: actions/cache@v4
        with:
          path: _pagecache
          key: pagecache-${{ github.run_id }}
          restore-keys: |
            pagecache-

      - name: Run Schedule Parser
        run: python update_all_groups_v3.py

      - name: Commit and push if schedule changed
        id: commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add schedule.json schedule-meta.json
          if git diff --cached --quiet; then
            echo "расписание не изменилось"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update schedule.json [skip ci]"
          git push || (git pull --rebase --autostash && git push)
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update-schedule
    # Деплоим каждый прогон: schedule-meta.json получает свежее checked_at,
    # поэтому сайт знает, что парсер жив, даже если данные не менялись.
    # «Обновлено» при этом берётся из updated_at и не прыгает от деплоя к деплою.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install build tools
        run: npm ci

      # Builds src/ -> dist/. If this step fails, the deploy step below never
      # runs and GitHub Pages keeps serving the last good deployment.
      - name: Build dist
        run: npm run build

      # Refuses to publish a half-built die: shell wiring, bundle presence,
      # schedule.json validity, content hashes, service-worker precache.
      - name: Verify dist
        run: node toolchain_foundry/smoke.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ---- Firebase mirror: меню в корне + приложение в /mypars/ ----
      # Dormant until the FIREBASE_TOKEN secret exists (firebase login:ci).
      - name: Checkout menu (hub)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: clashroalyskachat-glitch/clashroalyskachat-glitch.github.io
          path: hub-src

      - name: Compose Firebase layout
        if: github.event_name == 'workflow_dispatch'
        run: HUB_DIR=hub-src node toolchain_foundry/firebase_layout.mjs

      - name: Deploy to Firebase
        if: github.event_name == 'workflow_dispatch'
        # secrets в if использовать нельзя — проверяем переменную внутри шага
        run: |
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "FIREBASE_TOKEN не задан — Firebase пропущен"
            exit 0
          fi
          npx --yes firebase-tools@13 deploy --only hosting --project nkselove \
            --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Зеркало иногда теряет файлы при заливке. Проверяем живые адреса и,
      # если что-то отдаёт не 200, перезаливаем полностью.
      - name: Verify Firebase mirror
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "FIREBASE_TOKEN не задан — проверка пропущена"
            exit 0
          fi

          check() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$1"; }
          probe() {
            echo "$(check https://nkselove.web.app/mypars/) $(check https://nkselove.web.app/mypars/index.html) $(check https://nkselove.web.app/mypars/schedule.json) $(check https://nkselove.web.app/404.html)"
          }

          # даём CDN секунды на переключение версии, иначе проверка видит старую
          sleep 10

          for i in 1 2 3 4; do
            read -r index shell data page404 <<< "$(probe)"
            if [ "$index" = "200" ] && [ "$shell" = "200" ] && [ "$data" = "200" ] && [ "$page404" = "200" ]; then
              echo "зеркало в порядке"
              exit 0
            fi
            echo "попытка $i: /mypars/=$index index.html=$shell schedule.json=$data 404.html=$page404"
            sleep 6
          done

          echo "::warning::Firebase отдаёт не всё — полная перезаливка"
          rm -rf .firebase
          npx --yes firebase-tools@13 deploy --only hosting --project nkselove \
            --token "$FIREBASE_TOKEN" --non-interactive
          sleep 10
          read -r index shell data page404 <<< "$(probe)"
          echo "после повтора: /mypars/=$index index.html=$shell schedule.json=$data 404.html=$page404"
          [ "$index" = "200" ] && [ "$shell" = "200" ] && [ "$data" = "200" ] && [ "$page404" = "200" ]
