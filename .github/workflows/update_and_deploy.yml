name: Auto-Update Schedule & Deploy

on:
  push:
    # Any push to main goes live. The parser's own schedule.json commit uses
    # "[skip ci]" so it cannot retrigger this workflow - no loop.
    branches:
      - main
  schedule:
    # NB: cron is UTC (GitHub Actions). Moscow = UTC+3.
    #
    # Максимальная частота, которую GitHub вообще даёт, - каждые 5 минут.
    # Более частый cron (* * * * *) он схлопывает и часть запусков теряет.
    # Сетка сдвинута на 2 минуты: на :00 и :05 задержки самые большие,
    # а так каждый запуск попадает на «спокойную» минуту.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch: # Ручной запуск кнопкой в GitHub

# Не запускать новый прогон, пока предыдущий ещё идёт
concurrency:
  group: parse-schedule
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Schedule Parser
        run: python update_all_groups_v3.py

      - name: Commit and push if schedule changed
        id: commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add schedule.json

          if git diff --staged --quiet; then
            echo "Расписание не изменилось"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update schedule.json [skip ci]"
            git push || echo "Push skipped"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update-schedule
    # Плановый прогон деплоит, только если данные реально поменялись:
    # иначе 288 публикаций в сутки - лишняя нагрузка на Pages.
    if: github.event_name != 'schedule' || needs.update-schedule.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
