<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Расписание НКСЭ</title>
    <meta name="description" content="Расписание занятий НКСЭ — по группам и дням, с поиском по преподавателям и кабинетам.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="НКСЭ">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS Config & CDN -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", Roboto, sans-serif']
                    },
                    colors: {
                        darkbg: '#0B0F19',
                        cardbg: '#121826',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* iOS-style Animations */
        @keyframes slideTab {
            0% { transform: translateX(0); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotate360 {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .day-tab {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        /* Card entrance: 30px rise from above, 0.4s ease, 0.05s stagger.
           Day cards are NOT animated - matching the original look.
           Only change vs original: fill-mode "backwards" instead of
           "forwards" + a bare `opacity: 0`, so cards can never be left
           invisible if the animation is skipped. */
        .schedule-card {
            animation: fadeInUp 0.52s cubic-bezier(0.25, 0.46, 0.45, 0.94) backwards;
        }
        @keyframes fadeInUp {
            0% { transform: translateY(36px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        /* smooth, eased hover + focus travel */
        .schedule-card,
        .day-card,
        .quick-btn,
        .pin-btn,
        .search-input,
        .day-tab {
            transition:
                transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1),
                border-color 0.3s ease,
                background-color 0.3s ease,
                color 0.3s ease,
                box-shadow 0.3s ease;
        }
        @media (hover: hover) {
            .schedule-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 26px -14px rgb(168 85 247 / 0.45);
            }
        }
        @media (max-width: 640px) {
            #days-tabs {
                transition: transform 0.25s ease;
            }
        }
        [data-theme="dark"] body {
            background-color: #000000 !important;
            background-image: none !important;
            color: #ffffff !important;
            min-height: 100vh;
        }
        [data-theme="dark"] header {
            background: #000000 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-bottom: 1px solid #ffffff !important;
            box-shadow: none !important;
            color: #ffffff !important;
        }
        [data-theme="dark"] footer {
            background: #000000 !important;
            backdrop-filter: none !important;
            border-top: 1px solid #ffffff !important;
            color: #ffffff !important;
        }
        [data-theme="dark"] .bg-white {
            background: #000000 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 1px solid #ffffff !important;
            box-shadow: none !important;
            color: #ffffff !important;
        }
        [data-theme="dark"] .bg-slate-50,
        [data-theme="dark"] .bg-slate-100 {
            background: #000000 !important;
            backdrop-filter: none !important;
            border: 1px solid #ffffff !important;
            color: #ffffff !important;
        }
        [data-theme="dark"] .bg-slate-200 {
            background: #000000 !important;
            backdrop-filter: none !important;
            border: 1px solid #ffffff !important;
            color: #ffffff !important;
        }
        [data-theme="dark"] .text-slate-900,
        [data-theme="dark"] .text-slate-800,
        [data-theme="dark"] .text-slate-700,
        [data-theme="dark"] h1,
        [data-theme="dark"] h3,
        [data-theme="dark"] h4,
        [data-theme="dark"] .text-slate-600,
        [data-theme="dark"] .text-slate-500 {
            color: #ffffff !important;
            font-weight: 800;
            text-shadow: none !important;
        }
        [data-theme="dark"] .border-slate-200,
        [data-theme="dark"] .border-slate-300 {
            border-color: #ffffff !important;
        }
        [data-theme="dark"] #days-tabs {
            background-color: #000000 !important;
            border-color: #ffffff !important;
        }
         [data-theme="dark"] #days-tabs button {
             background-color: #000000 !important;
             border-color: #ffffff !important;
             color: #ffffff !important;
         }
         [data-theme="dark"] #days-tabs button.day-tab-active,
         [data-theme="dark"] #days-tabs button[class*="text-purple-400"] {
             background-color: transparent !important;
             color: #a855f7 !important;
             border-color: #a855f7 !important;
         }
         [data-theme="dark"] select,
        [data-theme="dark"] button:not(.bg-blue-600) {
            background: #000000 !important;
            backdrop-filter: none !important;
            color: #ffffff !important;
            border: 1px solid #ffffff !important;
        }
        /* Lesson card overrides - pure black & white */
        [data-theme="dark"] #schedule-container > div {
            background: #000000 !important;
            border: 1px solid #ffffff !important;
            box-shadow: none !important;
        }
        [data-theme="dark"] #schedule-container .bg-emerald-50,
        [data-theme="dark"] #schedule-container .bg-slate-50,
        [data-theme="dark"] #schedule-container .bg-slate-100,
        [data-theme="dark"] #schedule-container .bg-white {
            background: #000000 !important;
        }
        [data-theme="dark"] #schedule-container .border-slate-200,
        [data-theme="dark"] #schedule-container .border-slate-800,
        [data-theme="dark"] #schedule-container .border-slate-700 {
            border-color: #ffffff !important;
        }
        [data-theme="dark"] #schedule-container .text-slate-700,
        [data-theme="dark"] #schedule-container .text-slate-300,
        [data-theme="dark"] #schedule-container .text-slate-900,
        [data-theme="dark"] #schedule-container .text-white {
            color: #ffffff !important;
        }
        [data-theme="dark"] #schedule-container .bg-emerald-600 {
            background: #000000 !important;
            border: 1px solid #ffffff !important;
            color: #ffffff !important;
        }
        [data-theme="dark"] #schedule-container .bg-blue-50,
        [data-theme="dark"] #schedule-container .bg-blue-950\/50 {
            background: #000000 !important;
        }
        [data-theme="dark"] #schedule-container .text-blue-700,
        [data-theme="dark"] #schedule-container .text-blue-300 {
            color: #ffffff !important;
        }
        [data-theme="dark"] #schedule-container .border-blue-200,
        [data-theme="dark"] #schedule-container .border-blue-800 {
            border-color: #ffffff !important;
        }

        /* ============================================================
           FLUID SCALE — one continuous ramp for every screen size.
           Phone -> tablet -> laptop -> desktop -> 4K TV.
           Sizes are rem-based so the :root font-size steps below
           scale the whole layout up on living-room displays.
           ============================================================ */
        :root {
            /* type — flat up to ~1600px (original compact sizes), then grows */
            --fs-badge:  clamp(0.750rem, 0.42rem + 0.22vw, 1.000rem);
            --fs-meta:   clamp(0.8125rem, 0.46rem + 0.24vw, 1.0625rem);
            --fs-subj:   clamp(1.000rem, 0.55rem + 0.30vw, 1.375rem);
            --fs-day:    clamp(1.0625rem, 0.60rem + 0.32vw, 1.500rem);
            --fs-title:  clamp(1.000rem, 0.55rem + 0.30vw, 1.375rem);

            /* spacing — stays compact like the original design */
            --pad-x:     clamp(1rem,     0.35rem + 0.55vw, 3rem);
            --pad-y:     clamp(1.5rem,   1.20rem + 0.20vw, 3rem);
            --pad-card:  clamp(1rem,     0.82rem + 0.12vw, 1.375rem);
            --pad-day:   calc(var(--pad-card) * 1.15);
            --pad-tab-y: clamp(0.625rem, 0.52rem + 0.06vw, 0.875rem);
            --pad-tab-x: clamp(1rem,     0.85rem + 0.10vw, 1.5rem);
            --gap-grid:  clamp(1rem,     0.80rem + 0.13vw, 2rem);
            --gap-soft:  clamp(0.625rem, 0.52rem + 0.07vw, 1.125rem);
            --gap-micro: clamp(0.375rem, 0.31rem + 0.04vw, 0.625rem);
            --radius:    clamp(1rem, 0.90rem + 0.30vw, 1.40rem);
            --radius-sm: calc(var(--radius) - 0.30rem);
            --radius-xs: calc(var(--radius) - 0.55rem);
            --border-w:  clamp(1px, 0.6px + 0.10vw, 3px);

            --shell:     100%;
            --shell-max: 1600px;
            --tap-min:   44px;
        }

        /* Scale the whole layout up on large / TV displays.
           rem-based tokens above follow automatically. */
        @media (min-width: 1600px) { :root { font-size: 17px; --shell-max: 1760px; } }
        @media (min-width: 2000px) { :root { font-size: 19px; --shell-max: 2100px; } }
        @media (min-width: 2800px) { :root { font-size: 22px; --shell-max: 2900px; } }
        @media (min-width: 3600px) { :root { font-size: 25px; --shell-max: 3700px; } }

        /* ---- semantic type helpers (keep colour utilities intact) ---- */
        .fs-badge { font-size: var(--fs-badge); }
        .fs-meta  { font-size: var(--fs-meta); }
        .fs-subj  { font-size: var(--fs-subj); }
        .fs-day   { font-size: var(--fs-day); }
        .fs-title { font-size: var(--fs-title); }

        /* ---- layout shell ---- */
        .shell {
            width: 100%;
            max-width: var(--shell-max);
            margin-inline: auto;
            padding-inline: max(var(--pad-x), env(safe-area-inset-left), env(safe-area-inset-right));
        }
        main.shell { padding-block: var(--pad-y); }

        header .shell {
            padding-block: clamp(0.75rem, 0.55rem + 0.6vw, 1.75rem);
            padding-left:  max(var(--pad-x), env(safe-area-inset-left));
            padding-right: max(var(--pad-x), env(safe-area-inset-right));
        }
        footer.shell {
            padding-block: clamp(1rem, 0.7rem + 0.9vw, 2.25rem);
            padding-bottom: max(clamp(1rem, 0.7rem + 0.9vw, 2.25rem), env(safe-area-inset-bottom));
        }

        html, body { min-height: 100%; }
        body { min-height: 100dvh; overflow-x: hidden; }

        /* ---- day tabs ---- */
        #days-tabs {
            padding: var(--gap-micro);
            padding-bottom: calc(var(--gap-micro) + 0.25rem);
            gap: var(--gap-micro);
            margin-bottom: var(--gap-grid);
            border-radius: var(--radius);
            scroll-padding-inline: var(--pad-x);
            -webkit-overflow-scrolling: touch;
        }
        .day-tab {
            padding-block: var(--pad-tab-y);
            padding-inline: var(--pad-tab-x);
            border-radius: calc(var(--radius) - 0.25rem);
            font-size: var(--fs-meta);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* ---- schedule grid ---- */
        #schedule-container {
            display: grid;
            gap: var(--gap-grid);
            grid-template-columns: 1fr;
        }
        #schedule-container > div { min-width: 0; }
        /* 6 day cards, so only balanced column counts: 1 / 2 / 3 / 6.
           4 or 5 would leave a ragged 4+2 / 5+1 second row. */
        @media (min-width: 700px)  { #schedule-container { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1200px) { #schedule-container { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 2400px) { #schedule-container { grid-template-columns: repeat(6, 1fr); } }

        /* subject is the hero line: sized to carry the card width */
        .lesson-card h4 {
            font-size: clamp(1.05rem, 0.90rem + 0.55vw, 1.70rem);
            margin-block: 0.12em 0.30em;
        }

        /* ---- lesson cards: fixed 3-row structure so every card
               has the same rhythm regardless of content length ---- */
        .day-card   { padding: var(--pad-day); border-radius: var(--radius); display: flex; flex-direction: column; }
        .lesson-card{
            padding: var(--pad-card);
            border-radius: var(--radius-sm);
            border-left-width: var(--border-w);
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: var(--gap-micro);
            overflow-wrap: break-word;
        }
        .lesson-head{
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--gap-micro);
            justify-content: space-between;
        }
        .live-tag { letter-spacing: 0.02em; }
        /* ---- minimal lesson card: no nested boxes, hierarchy from space/weight ---- */
        .lesson-num {
            display: inline-flex;
            align-items: baseline;
            gap: 0.5em;
            font-weight: 800;
            opacity: .55;
        }
        .lesson-num .num-time { font-weight: 700; opacity: .85; }
        .lesson-num.is-active { opacity: 1; color: #a855f7; }
        .sub-tag {
            font-weight: 800;
            opacity: .45;
            letter-spacing: 0.04em;
        }
        /* substituted lesson (замена) - amber reads on both light and dark */
        .sub-flag {
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #f59e0b;
            opacity: .95;
            margin-left: auto;
        }
        /* number+time anchor left, any flag hugs the right edge */
        .lesson-head > .lesson-num { margin-right: auto; }
        .meta-item { opacity: .6; font-weight: 600; }
        /* room sits at the far right so the row spans the card instead of
           leaving a dead gap - same job the old bordered chips did */
        .meta-item.is-room {
            opacity: .75;
            font-weight: 700;
            border-bottom: 1px dashed currentColor;
            padding-bottom: 1px;
            margin-left: auto;
        }
        .meta-item.is-room:hover { opacity: 1; }

        /* ---- day header: quiet, borderless ---- */
        .day-count { opacity: .5; font-weight: 700; }
        .day-copy {
            font-weight: 700;
            opacity: .45;
            background: transparent;
            border: none;
            cursor: pointer;
            color: inherit;
            padding: 0;
        }
        .day-copy:hover { opacity: .9; }

        /* ---- quick access to pinned groups ---- */
        .quick-bar{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--gap-micro);
            margin-bottom: var(--gap-soft);
        }
        .quick-bar:empty { display: none; }

        /* ---- staleness indicator ---- */
        .stale-dot{
            flex: 0 0 auto;
            width: .6em; height: .6em;
            border-radius: 999px;
            background: #f59e0b;
            align-self: center;
        }
        .stale-dot[hidden] { display: none; }
        @media (prefers-reduced-motion: no-preference) {
            .stale-dot { animation: staleBlink 2.4s ease-in-out infinite; }
            @keyframes staleBlink {
                0%, 100% { opacity: 1; }
                50% { opacity: .3; }
            }
        }

        /* ---- "what's happening now" bar ---- */
        .now-bar{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--gap-micro) var(--gap-soft);
            font-size: var(--fs-meta);
            padding: var(--gap-micro) var(--gap-soft);
            margin-bottom: var(--gap-soft);
            border-radius: 999px;
            border: 1px solid rgb(148 163 184 / 0.45);
        }
        .now-bar[hidden] { display: none; }
        .now-bar .now-dot{
            width: .55em; height: .55em; border-radius: 999px;
            background: #a855f7; flex: 0 0 auto;
            animation: nowPulse 1.8s ease-in-out infinite;
        }
        .now-bar.is-live { border-color: #a855f7; }
        .now-bar.is-free .now-dot { background: #64748b; animation: none; }
        .now-bar b { font-weight: 800; }
        .now-bar .now-left { opacity: .7; }
        @keyframes nowPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .35; transform: scale(.75); }
        }
        @media (prefers-reduced-motion: reduce) {
            .now-bar .now-dot { animation: none; }
        }

        .quick-btn{
            font-size: var(--fs-meta);
            font-weight: 700;
            padding: calc(var(--gap-micro) * 0.9) var(--gap-soft);
            border-radius: 999px;
            border: 1px solid rgb(148 163 184 / 0.5);
            background: transparent;
            color: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color .2s ease, border-color .2s ease, color .2s ease;
        }
        .quick-btn:hover { background: rgb(148 163 184 / 0.12); }
        .quick-btn[aria-current="true"] {
            border-color: #a855f7;
            color: #a855f7;
        }
        .pin-btn{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: var(--fs-meta);
            padding: calc(var(--gap-micro) * 0.9) var(--gap-soft);
            border-radius: 999px;
            border: 1px solid rgb(148 163 184 / 0.5);
            background: transparent;
            color: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease;
        }
        .pin-btn:hover { background: rgb(148 163 184 / 0.12); }
        .pin-btn[aria-pressed="true"] { border-color: #a855f7; color: #a855f7; }
        .pin-btn:disabled { opacity: .4; cursor: default; }

        /* ---- search ---- */
        .search-wrap{
            display: flex;
            align-items: center;
            gap: var(--gap-micro);
            margin-bottom: var(--gap-soft);
            flex-wrap: wrap;
        }
        .search-input{
            flex: 1 1 16rem;
            font-size: var(--fs-meta);
            padding: calc(var(--gap-micro) * 1.4) var(--gap-soft);
            border-radius: 999px;
            border: 1px solid rgb(148 163 184 / 0.5);
            background: transparent;
            color: inherit;
            min-width: 0;
        }
        .search-input:focus { outline: none; border-color: #a855f7; }
        .search-reset{
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: var(--fs-meta);
            padding: calc(var(--gap-micro) * 1.4) var(--gap-soft);
            border-radius: 999px;
            opacity: .6;
        }
        .search-reset:hover { opacity: 1; }
        .search-results{
            display: flex;
            flex-direction: column;
            gap: var(--gap-micro);
            margin-bottom: var(--gap-soft);
        }
        .search-hit{
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: var(--gap-micro) var(--gap-soft);
            font-size: var(--fs-meta);
            padding: var(--gap-micro) var(--gap-soft);
            border-radius: calc(var(--radius) - 0.4rem);
            border: 1px solid rgb(148 163 184 / 0.4);
        }
        .search-hit b { font-weight: 800; }
        .search-hit .muted { opacity: .65; }
        /* wrapping row: chips keep their natural width, never stretch */
        .lesson-meta{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--gap-micro) var(--gap-soft);
        }
        .lesson-meta-row{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--gap-micro);
            flex: 1 0 100%;
        }
        .chip       { padding: calc(var(--gap-micro) * 0.75) var(--gap-soft); border-radius: calc(var(--radius) - 0.35rem); }
        .chip-sm    { padding: calc(var(--gap-micro) * 0.4) calc(var(--gap-micro) * 1.1); border-radius: calc(var(--radius) - 0.5rem); }
        .stack      { display: flex; flex-direction: column; gap: var(--gap-soft); }
        .row-wrap   { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap-micro); }

        /* lessons inside one day share a row so cards line up evenly */
        #schedule-container .stack { flex: 1 1 auto; }
        #schedule-container .stack > .lesson-card { flex: 1 1 0; }

        /* room button needs a real touch target even though padding is tight */
        .room-btn   { display: inline-flex; align-items: center; justify-content: center; }

        /* enlarge tap targets only on actual touch devices */
        @media (pointer: coarse) {
            .day-tab,
            .room-btn,
            #theme-toggle,
            #group-select { min-height: var(--tap-min); }
            .room-btn, #theme-toggle { min-width: var(--tap-min); }
        }

        /* empty / loading states */
        .state-box  { padding: calc(var(--pad-card) * 2.5); border-radius: var(--radius); }

        /* ---- hover effects only where a real pointer exists ---- */
        @media (hover: none) {
            .schedule-card:hover { transform: none !important; }
        }

        /* ---- keyboard / remote focus ---- */
        :focus-visible {
            outline: 3px solid #a855f7;
            outline-offset: 2px;
            border-radius: calc(var(--radius) - 0.3rem);
        }

        /* ---- phone landscape: vertical space is scarce ---- */
        @media (max-height: 520px) and (orientation: landscape) {
            :root { --pad-y: clamp(0.75rem, 0.5rem + 1vw, 1.5rem); }
            #days-tabs { margin-bottom: var(--gap-soft); }
        }

        /* ---- accessibility ----
           Reduced motion shortens and softens the entrance but KEEPS the
           top-to-bottom travel, because removing the movement entirely made
           cards look like they were simply blinking in. */
        @media (prefers-reduced-motion: reduce) {
            .schedule-card {
                animation: fadeInUpSoft 0.42s ease-out backwards !important;
            }
            @keyframes fadeInUpSoft {
                0%   { opacity: 0; transform: translateY(12px); }
                100% { opacity: 1; transform: translateY(0); }
            }
            .schedule-card,
            .day-tab,
            .quick-btn,
            .pin-btn,
            .search-input {
                transition: none !important;
            }
            .now-bar .now-dot { animation: none !important; }
        }
        /* ---- print: strip chrome, keep the schedule readable on paper ---- */
        @media print {
            @page { margin: 12mm; }
            html, body { background: #fff !important; color: #000 !important; }
            [data-theme="dark"] body,
            [data-theme="dark"] header,
            [data-theme="dark"] footer,
            [data-theme="dark"] .day-card,
            [data-theme="dark"] .lesson-card,
            [data-theme="dark"] #days-tabs,
            [data-theme="dark"] #days-tabs button { background: #fff !important; color: #000 !important; }
            [data-theme="dark"] .border-slate-200,
            [data-theme="dark"] .border-slate-300,
            [data-theme="dark"] .border-slate-700,
            [data-theme="dark"] .border-slate-800,
            [data-theme="dark"] .border { border-color: #999 !important; }
            header, footer, #theme-toggle, #pin-btn, #quick-groups,
            #search-wrap, #search-results, .no-scrollbar { display: none !important; }
            main.shell { padding: 0 !important; max-width: none !important; }
            #days-tabs { display: none !important; }
            #schedule-container { grid-template-columns: repeat(2, 1fr) !important; gap: 8mm !important; }
            .day-card, .lesson-card { break-inside: avoid; page-break-inside: avoid; box-shadow: none !important; }
            .schedule-card, .day-card { animation: none !important; opacity: 1 !important; }
            .chip, .room-btn, .quick-btn { border-color: #999 !important; }
        }
    </style>
    <script>
        (function () {
            var key = 'nkse-theme-v2';
            var saved = localStorage.getItem(key);
            var theme = saved ? saved : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
         function toggleTheme() {
             var key = 'nkse-theme-v2';
             var current = document.documentElement.getAttribute('data-theme');
             var next = current === 'dark' ? 'light' : 'dark';
             localStorage.setItem(key, next);
             document.documentElement.setAttribute('data-theme', next);
             // Lesson-card colours are baked into class names at render time,
             // so the schedule has to be re-rendered or it keeps the old theme
             // until something else happens to trigger a redraw.
             try {
                 if (typeof renderSchedule === 'function') renderSchedule();
                 if (typeof renderTabs === 'function') renderTabs();
             } catch (e) {}
         }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('nkse-theme-v2', theme);
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-darkbg text-slate-900 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">
    
    <!-- Header -->
    <header class="bg-white/90 dark:bg-cardbg/90 backdrop-blur-md border-b border-slate-200/85 dark:border-slate-800 sticky top-0 z-50 shadow-xs">
        <div class="shell flex flex-col sm:flex-row justify-between items-center gap-3">

            <!-- Логотип и выбор группы -->
            <div class="flex items-center gap-3.5 w-full min-w-0 sm:w-auto sm:flex-1 justify-between sm:justify-start">
                <div class="flex items-center gap-3 min-w-0">
                    <span class="fs-day select-none shrink-0">📅</span>
                    <div class="min-w-0">
                        <h1 class="fs-title font-extrabold tracking-tight text-slate-900 dark:text-white truncate">Расписание НКСЭ</h1>
                        <p class="fs-meta text-slate-500 dark:text-slate-400 font-medium truncate" id="last-updated">Загрузка...</p>
                    </div>
                </div>
                <span id="stale-dot" class="stale-dot" hidden title="Данные могут быть неактуальны"></span>

                <!-- Выпадающий список групп -->
                <div class="relative shrink-0 flex items-center gap-2">
                    <select id="group-select" class="fs-meta bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white font-bold px-3.5 py-2 border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-2xs max-w-[38vw] sm:max-w-none" style="border-radius: var(--radius-sm);">
                        <option value="СЗ-13-26">СЗ-13-26 ⭐</option>
                    </select>
                    <button id="pin-btn" class="pin-btn" aria-pressed="false" title="Закрепить группу в быстрый доступ">Закрепить</button>
                </div>
             </div>
             <!-- Переключатель темы (День / Ночь) -->
             <button id="theme-toggle" onclick="toggleTheme()" class="shrink-0 bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 p-2.5 transition cursor-pointer" title="Переключить тему" style="border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center;">
                 <svg class="w-[1.15em] h-[1.15em] hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                 <svg class="w-[1.15em] h-[1.15em] block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
             </button>
         </div>
     </header>

    <!-- Main Content -->
    <main class="shell flex-grow">

        <!-- Что идёт прямо сейчас -->
        <div id="now-bar" class="now-bar" hidden></div>

        <!-- Быстрый доступ к закреплённым группам -->
        <div class="quick-bar" id="quick-groups" aria-label="Закреплённые группы">
            <!-- Dynamically populated -->
        </div>

        <!-- Поиск по всем группам -->
        <div class="search-wrap" id="search-wrap">
            <input id="search-input" class="search-input" type="search" autocomplete="off"
                   placeholder="Поиск: преподаватель, кабинет, предмет…" aria-label="Поиск по расписанию">
            <button id="search-reset" class="search-reset" hidden>Очистить</button>
        </div>
        <div id="search-results" hidden></div>

        <!-- Segmented Control Tabs -->
        <div class="bg-slate-200/80 dark:bg-slate-900 flex overflow-x-auto no-scrollbar border border-slate-300/60 dark:border-slate-800 shadow-inner" id="days-tabs">
            <!-- Dynamically populated -->
        </div>

        <!-- Schedule Grid -->
        <div id="schedule-container">
            <!-- Loading state -->
            <div class="col-span-full state-box text-center text-slate-400">
                <div class="inline-block animate-spin rounded-full border-3 border-blue-600 border-t-transparent mb-3" style="width: clamp(1.75rem, 1.2rem + 1.6vw, 3.5rem); height: clamp(1.75rem, 1.2rem + 1.6vw, 3.5rem);"></div>
                <p class="fs-meta font-bold text-slate-600 dark:text-slate-300">Загружаем расписание...</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="shell border-t border-slate-200 dark:border-slate-800 text-center fs-meta text-slate-500 dark:text-slate-400 mt-auto bg-white dark:bg-cardbg">
        <p class="font-bold tracking-wide">НКСЭ &bull; СИСТЕМА РАСПИСАНИЯ ЗАНЯТИЙ</p>
        <p id="data-health" class="mt-1 opacity-60"></p>
        <p class="mt-1 opacity-40"><button type="button" onclick="clearOfflineCache()" class="underline decoration-dotted hover:opacity-100" title="Сбросить офлайн-кэш и перезагрузить">Сбросить кэш</button></p>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
