<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2cf"/>
      <stop offset=".28" stop-color="#f0c878"/>
      <stop offset=".62" stop-color="#c98a3c"/>
      <stop offset="1" stop-color="#7a3f12"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7085"/>
      <stop offset=".55" stop-color="#d4002a"/>
      <stop offset="1" stop-color="#7d0018"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- корона -->
  <path d="M7 23l10 9 7-15 8 15 8-15 7 15 10-9-4 25H11z"
        fill="url(#gold)" stroke="#5a2a08" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- бархат между зубцами -->
  <path d="M17 32l7-15 8 15 8-15 7 15-4 16H21z"
        fill="url(#red)" opacity=".9"/>
  <!-- нижняя лента -->
  <path d="M11 48h42l-2 7H13z" fill="url(#red)" stroke="#5a0010" stroke-width="1.4"/>
  <path d="M11 48h42" stroke="url(#gold)" stroke-width="2"/>
  <!-- камни на зубцах -->
  <circle cx="7" cy="22" r="3.2" fill="url(#red)" stroke="#ffd9a0" stroke-width=".8"/>
  <circle cx="24" cy="16" r="2.6" fill="url(#red)" stroke="#ffd9a0" stroke-width=".7"/>
  <circle cx="40" cy="16" r="2.6" fill="url(#red)" stroke="#ffd9a0" stroke-width=".7"/>
  <circle cx="57" cy="22" r="3.2" fill="url(#red)" stroke="#ffd9a0" stroke-width=".8"/>
  <!-- центральный алмаз -->
  <path d="M32 28l4 6-4 5-4-5z" fill="#fff6e2" stroke="#8a4a12" stroke-width=".9"/>
  <path d="M32 28l4 6-4 2z" fill="#ffd9a0" opacity=".8"/>
  <!-- блики -->
  <path d="M12 24l8 7" stroke="url(#shine)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <path d="M33 8l6 12" stroke="url(#shine)" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <!-- заклёпки -->
  <circle cx="20" cy="52" r="1.2" fill="#ffe9b8"/>
  <circle cx="32" cy="52" r="1.2" fill="#ffe9b8"/>
  <circle cx="44" cy="52" r="1.2" fill="#ffe9b8"/>
</svg>
